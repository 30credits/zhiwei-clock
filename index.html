<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>知味員工系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 90%;
      max-width: 400px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      background: white;
      text-align: center;
    }

    .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid #4caf50;
    }

    .btn-clock {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      color: white;
    }

    .btn-on {
      background-color: #198754;
    }

    .btn-off {
      background-color: #dc3545;
    }
    .btn-blue {
      background-color: #0d6efd;
    }

     .btn-purple {
       background-color: #6f42c1;
    }

     .btn-gray {
       background-color: #6c757d;
    }

    .btn-orange {
       background-color: #fd7e14;
    }

    #loading {
      font-size: 16px;
      color: #6c757d;
      white-space: pre-line;
    }
     .form-group {
      text-align: left;
      margin: 12px 0;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #333;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 16px;
    }
    
    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">系統啟動中，請稍候...知味員工系統</div>

    <div id="main-content" style="display: none;">
      <img id="user-picture" class="profile-img" src="" alt="頭像">
      <h3>哈囉，<span id="user-name">員工</span></h3>
      <p id="page-subtitle">請選擇服務</p>

      <!-- 主選單 -->
      <div id="home-menu">
        <button class="btn-clock btn-on" onclick="showClockMenu()">打卡</button>
        <button class="btn-clock btn-blue" onclick="showLeaveForm()">請假</button>
        <button class="btn-clock btn-purple" onclick="checkSalary()">查薪資表</button>
        <button class="btn-clock btn-gray" onclick="checkAnnualLeave()">查特休</button>
        <!-- 🎯 新增買菜金按鈕 -->
        <button class="btn-clock btn-orange" onclick="showPettyCashForm()">買菜金記帳</button>
        <button id="review-leave-button" class="btn-clock btn-purple" style="display: none;" onclick="showLeaveReview()">請假審核</button>
      </div>

      <!-- 打卡選單 -->
      <div id="clock-menu" style="display: none;">
        <button class="btn-clock btn-on" onclick="handleClock('上班')">上班打卡</button>
        <button class="btn-clock btn-off" onclick="handleClock('下班')">下班打卡</button>
        <button class="btn-clock btn-gray" onclick="showHomeMenu()">返回首頁</button>
      </div>
          
      <!-- 請假表單 -->
      <div id="leave-form" style="display: none;">
        <div class="form-group">
          <label for="leave-type">假別</label>
          <select id="leave-type">
            <option value="特休">特休</option>
            <option value="事假">事假</option>
            <option value="病假">病假</option>
            <option value="公假">公假</option>
            <option value="其他">其他</option>
          </select>
        </div>
      
        <div class="form-group">
          <label for="leave-start">開始日期</label>
          <input id="leave-start" type="date">
        </div>
      
        <div class="form-group">
          <label for="leave-start-time">開始時間</label>
          <input id="leave-start-time" type="time">
        </div>
      
        <div class="form-group">
          <label for="leave-end">結束日期</label>
          <input id="leave-end" type="date">
        </div>
      
        <div class="form-group">
          <label for="leave-end-time">結束時間</label>
          <input id="leave-end-time" type="time">
        </div>
      
        <div class="form-group">
          <label for="leave-reason">原因</label>
          <textarea id="leave-reason" placeholder="請輸入請假原因"></textarea>
        </div>
      
        <button class="btn-clock btn-blue" onclick="submitLeave()">送出請假申請</button>
        <button class="btn-clock btn-gray" onclick="showHomeMenu()">返回首頁</button>
      </div>
          
      <!-- 特休視圖 -->
      <div id="annual-leave-view" style="display: none;">
        <h4>我的特休</h4>
        <p id="annual-leave-result">查詢中...</p>
        <button class="btn-clock btn-gray" onclick="showHomeMenu()">返回首頁</button>
      </div> 

      <!-- 薪資表視圖 -->
      <div id="salary-view" style="display: none;">
        <div class="form-group" style="margin-bottom: 15px;">
          <label for="salary-month-select">選擇發放年月</label>
          <input id="salary-month-select" type="month" onchange="fetchSalaryData()">
        </div>
        <div id="salary-result">查詢中...</div>
        <button class="btn-clock btn-gray" onclick="showHomeMenu()">返回首頁</button>
      </div>
          
      <!-- 請假審核視圖 -->
      <div id="leave-review-view" style="display: none;">
        <div id="leave-review-list">讀取中...</div>
        <button class="btn-clock btn-gray" onclick="showHomeMenu()">返回首頁</button>
      </div>  

      <!-- 🎯 新增買菜金記帳視圖 -->
      <div id="petty-cash-form" style="display: none;">
        <div class="form-group">
          <label for="pc-type">交易類型</label>
          <select id="pc-type" onchange="toggleCategoryMenu()">
            <option value="支出">支出 (扣款)</option>
            <option value="入金">入金 (補錢/放錢)</option>
          </select>
        </div>

        <div class="form-group" id="pc-category-group">
          <label for="pc-category">選擇分類</label>
          <select id="pc-category" onchange="checkCustomCategory()">
            <option value="春億(醬料)">春億(醬料)</option>
            <option value="ESD/餐盒">ESD/餐盒</option>
            <option value="米">米</option>
            <option value="合盛">合盛</option>
            <option value="排骨/肉燥">排骨/肉燥</option>
            <option value="雞蛋/滷蛋">雞蛋/滷蛋</option>
            <option value="麵">麵</option>
            <option value="菜">菜</option>
            <option value="吳郭魚">吳郭魚</option>
            <option value="虱目魚">虱目魚</option>
            <option value="南北貨">南北貨</option>
            <option value="交通">交通</option>
            <option value="瓦斯">瓦斯</option>
            <option value="冰">冰</option>
            <option value="卜健">卜健</option>
            <option value="其他">其他 (自行輸入)</option>
          </select>
        </div>

        <div class="form-group" id="pc-custom-category-group" style="display: none;">
          <label for="pc-custom-category">自訂分類名稱</label>
          <input id="pc-custom-category" type="text" placeholder="請輸入自訂分類">
        </div>

        <div class="form-group">
          <label for="pc-amount">金額</label>
          <input id="pc-amount" type="number" placeholder="請輸入金額">
        </div>

        <div class="form-group">
          <label for="pc-note">備註 (可不填)</label>
          <input id="pc-note" type="text" placeholder="例：廠商收據號碼或說明">
        </div>

        <button class="btn-clock btn-blue" onclick="submitPettyCash()">確認送出</button>
        <button class="btn-clock btn-gray" onclick="showHomeMenu()">返回首頁</button>
      </div>
    </div>
  </div>

  <script>
    const liffId = "2010509536-AYeAZGh2";
    const gasUrl = "https://script.google.com/macros/s/AKfycbyYpWpgCNsoX490cCUpEryu8Jb8ShDg_frwZOwcDDh1RboTU-PsVpoTq8BSQxIfi2OuNA/exec";

    let userName = "";
    let userId = "";

    async function initLiff() {
      try {
        setLoading("正在初始化 LINE...");

        await liff.init({ liffId: liffId });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        setLoading("正在讀取員工資料...");

        const profile = await liff.getProfile();

        userName = profile.displayName;
        userId = profile.userId;

        document.getElementById("user-name").innerText = userName;
        document.getElementById("user-picture").src = profile.pictureUrl || "";

        checkReviewerPermission();
        document.getElementById("loading").style.display = "none";
        document.getElementById("main-content").style.display = "block";

      } catch (error) {
        setLoading("LIFF 初始化失敗：\n" + error.message);
      }
    }

    function handleClock(type) {
      document.getElementById("main-content").style.display = "none";
      document.getElementById("loading").style.display = "block";
      setLoading("正在取得 GPS 定位...");

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          setLoading("正在送出打卡資料...");

          submitToAppsScript({
            name: userName,
            userId: userId,
            type: type,
            lat: lat,
            lng: lng
          });

          alert(type + "打卡資料已送出，請到試算表確認紀錄。");

          if (liff.isInClient()) {
            liff.closeWindow();
          }
        },
        function(error) {
          alert("無法取得定位：" + error.message);
          resetUI();
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function submitToAppsScript(data) {
      const iframeName = "hidden-submit-frame";

      let iframe = document.getElementById(iframeName);
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.name = iframeName;
        iframe.id = iframeName;
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }

      const form = document.createElement("form");
      form.method = "POST";
      form.action = gasUrl;
      form.target = iframeName;
      form.style.display = "none";

      const input = document.createElement("input");
      input.name = "payload";
      input.value = JSON.stringify(data);

      form.appendChild(input);
      document.body.appendChild(form);

      form.submit();

      setTimeout(function() {
        document.body.removeChild(form);
      }, 1000);
    }

    function resetUI() {
      document.getElementById("loading").style.display = "none";
      document.getElementById("main-content").style.display = "block";
    }

    function showClockMenu() {
      document.getElementById("home-menu").style.display = "none";
      document.getElementById("clock-menu").style.display = "block";
      document.getElementById("page-subtitle").innerText = "請選擇打卡類型";
    }

    function showHomeMenu() {
      document.getElementById("clock-menu").style.display = "none";
      document.getElementById("leave-form").style.display = "none";
      document.getElementById("annual-leave-view").style.display = "none";
      document.getElementById("leave-review-view").style.display = "none";
      document.getElementById("salary-view").style.display = "none";
      document.getElementById("petty-cash-form").style.display = "none"; // 🎯 關閉買菜金頁面
      document.getElementById("home-menu").style.display = "block";
      document.getElementById("page-subtitle").innerText = "請選擇服務";
    }

    // 🎯 買菜金相關控制邏輯
    function showPettyCashForm() {
      document.getElementById("home-menu").style.display = "none";
      document.getElementById("clock-menu").style.display = "none";
      document.getElementById("leave-form").style.display = "none";
      document.getElementById("annual-leave-view").style.display = "none";
      document.getElementById("leave-review-view").style.display = "none";
      document.getElementById("salary-view").style.display = "none";
      document.getElementById("petty-cash-form").style.display = "block";
      document.getElementById("page-subtitle").innerText = "買菜金記帳";

      // 清空預設值
      document.getElementById("pc-type").value = "支出";
      document.getElementById("pc-category").value = "春億(醬料)";
      document.getElementById("pc-custom-category").value = "";
      document.getElementById("pc-amount").value = "";
      document.getElementById("pc-note").value = "";
      toggleCategoryMenu();
    }

    function toggleCategoryMenu() {
      const type = document.getElementById("pc-type").value;
      const catGroup = document.getElementById("pc-category-group");
      if (type === "入金") {
        catGroup.style.display = "none";
        document.getElementById("pc-custom-category-group").style.display = "none";
      } else {
        catGroup.style.display = "block";
        checkCustomCategory();
      }
    }

    function checkCustomCategory() {
      const cat = document.getElementById("pc-category").value;
      const customGroup = document.getElementById("pc-custom-category-group");
      if (cat === "其他") {
        customGroup.style.display = "block";
      } else {
        customGroup.style.display = "none";
      }
    }

    function submitPettyCash() {
      const type = document.getElementById("pc-type").value;
      let category = document.getElementById("pc-category").value;
      const customCategory = document.getElementById("pc-custom-category").value.trim();
      const amount = document.getElementById("pc-amount").value;
      const note = document.getElementById("pc-note").value.trim();

      if (type === "入金") {
        category = "店主入金";
      } else if (category === "其他") {
        if (!customCategory) {
          alert("請輸入自訂分類名稱！");
          return;
        }
        category = customCategory;
      }

      if (!amount || Number(amount) <= 0) {
        alert("請輸入正確的金額！");
        return;
      }

      submitToAppsScript({
        action: "pettyCash",
        name: userName,
        userId: userId,
        type: type,
        category: category,
        amount: amount,
        note: note
      });

      alert(type + "紀錄已送出！金額：" + amount + " 元");
      showHomeMenu();
    }

    function checkSalary() {
      document.getElementById("home-menu").style.display = "none";
      document.getElementById("clock-menu").style.display = "none";
      document.getElementById("leave-form").style.display = "none";
      document.getElementById("annual-leave-view").style.display = "none";
      document.getElementById("leave-review-view").style.display = "none";
      document.getElementById("salary-view").style.display = "block";
      document.getElementById("page-subtitle").innerText = "薪資明細";

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const currentMonth = `${year}-${month}`;

      const monthInput = document.getElementById("salary-month-select");
      if (!monthInput.value) {
        monthInput.value = currentMonth;
      }

      fetchSalaryData();
    }

    async function fetchSalaryData() {
      const selectedMonth = document.getElementById("salary-month-select").value;
      if (!selectedMonth) return;

      document.getElementById("salary-result").innerText = "查詢中...";

      try {
        const url = gasUrl
          + "?action=salary"
          + "&userId=" + encodeURIComponent(userId)
          + "&month=" + encodeURIComponent(selectedMonth);

        const response = await fetch(url);
        const result = await response.json();

        if (!result.success) {
          document.getElementById("salary-result").innerText = result.status || "查無此月份薪資紀錄";
          return;
        }

        let html = `
          <div style="text-align:left; border:1px solid #e0e0e0; border-radius:10px; padding:15px; margin:12px 0; background:#fff; white-space: pre-line; line-height: 1.6;">
            ${result.displayText}
          </div>
        `;

        document.getElementById("salary-result").innerHTML = html;

      } catch (error) {
        document.getElementById("salary-result").innerText = "查詢失敗：" + error.message;
      }
    }

    async function checkAnnualLeave() {
      document.getElementById("home-menu").style.display = "none";
      document.getElementById("clock-menu").style.display = "none";
      document.getElementById("leave-form").style.display = "none";
      document.getElementById("annual-leave-view").style.display = "block";
      document.getElementById("page-subtitle").innerText = "特休查詢";
      document.getElementById("annual-leave-result").innerText = "查詢中...";

      try {
        const url = gasUrl
          + "?action=annualLeave"
          + "&userId=" + encodeURIComponent(userId);

        const response = await fetch(url);
        const result = await response.json();

        if (result.success) {
          document.getElementById("annual-leave-result").innerText =
            "年度：" + result.year + "\n" +
            "總特休：" + result.totalDays + "天\n" +
            "已使用：" + result.usedHours + "小時\n" +
            "剩餘：" + result.displayText;
        } else {
          document.getElementById("annual-leave-result").innerText =
            result.status || "查詢失敗";
        }
      } catch (error) {
        document.getElementById("annual-leave-result").innerText =
          "查詢失敗：" + error.message;
      }
    }

    async function checkReviewerPermission() {
      try {
        const url = gasUrl
          + "?action=pendingLeaves"
          + "&userId=" + encodeURIComponent(userId);

        const response = await fetch(url);
        const result = await response.json();

        if (result.success) {
          document.getElementById("review-leave-button").style.display = "block";
        }
      } catch (error) {
        console.log("審核權限檢查失敗", error);
      }
    }

    async function showLeaveReview() {
      document.getElementById("home-menu").style.display = "none";
      document.getElementById("clock-menu").style.display = "none";
      document.getElementById("leave-form").style.display = "none";
      document.getElementById("annual-leave-view").style.display = "none";
      document.getElementById("leave-review-view").style.display = "block";
      document.getElementById("page-subtitle").innerText = "請假審核";
      document.getElementById("leave-review-list").innerText = "讀取中...";

      try {
        const url = gasUrl
          + "?action=pendingLeaves"
          + "&userId=" + encodeURIComponent(userId);

        const response = await fetch(url);
        const result = await response.json();

        if (!result.success) {
          document.getElementById("leave-review-list").innerText =
            result.status || "無法讀取請假資料";
          return;
        }

        if (result.leaves.length === 0) {
          document.getElementById("leave-review-list").innerText = "目前沒有待審核請假";
          return;
        }

        let html = "";

        result.leaves.forEach(function(item) {
          const sDate = String(item.startDate).split("T")[0];
          const sTime = String(item.startTime).includes("T") ? String(item.startTime).split("T")[1].substring(0, 5) : item.startTime;
          const eDate = String(item.endDate).split("T")[0];
          const eTime = String(item.endTime).includes("T") ? String(item.endTime).split("T")[1].substring(0, 5) : item.endTime;

          html += `
            <div style="text-align:left; border:1px solid #e0e0e0; border-radius:10px; padding:15px; margin:12px 0; background-color:#fff;">
              <div style="font-size:16px; font-weight:bold; margin-bottom:6px;">${item.name} <span style="font-size:14px; font-weight:normal; color:#666;">(${item.leaveType})</span></div>
              <div style="font-size:14px; color:#444; margin-bottom:4px;"><strong>時間：</strong>${sDate} ${sTime} ~ ${eDate} ${eTime}</div>
              <div style="font-size:14px; color:#444; margin-bottom:4px;"><strong>時數：</strong>${item.hours} 小時</div>
              <div style="font-size:14px; color:#444; margin-bottom:12px;"><strong>原因：</strong>${item.reason}</div>
              <button class="btn-clock btn-on" style="margin:5px 0;" onclick="reviewLeave(${item.rowNumber}, '已核准')">核准</button>
              <button class="btn-clock btn-off" style="margin:5px 0;" onclick="reviewLeave(${item.rowNumber}, '已駁回')">駁回</button>
            </div>
          `;
        });

        document.getElementById("leave-review-list").innerHTML = html;

      } catch (error) {
        document.getElementById("leave-review-list").innerText =
          "讀取失敗：" + error.message;
      }
    }

    function reviewLeave(rowNumber, decision) {
      if (!confirm("確定要" + decision + "這筆請假嗎？")) {
        return;
      }

      submitToAppsScript({
        action: "reviewLeave",
        reviewerUserId: userId,
        rowNumber: rowNumber,
        decision: decision
      });

      alert("已送出：" + decision);

      setTimeout(function() {
        showLeaveReview();
      }, 1000);
    }

    function showLeaveForm() {
      document.getElementById("home-menu").style.display = "none";
      document.getElementById("clock-menu").style.display = "none";
      document.getElementById("annual-leave-view").style.display = "none";
      document.getElementById("leave-form").style.display = "block";
      document.getElementById("page-subtitle").innerText = "請填寫請假申請";
    }

    function submitLeave() {
      const leaveType = document.getElementById("leave-type").value;
      const startDate = document.getElementById("leave-start").value;
      const startTime = document.getElementById("leave-start-time").value;
      const endDate = document.getElementById("leave-end").value;
      const endTime = document.getElementById("leave-end-time").value;
      const reason = document.getElementById("leave-reason").value.trim();

      if (!startDate) { alert("請選擇開始日期"); return; }
      if (!startTime) { alert("請選擇開始時間"); return; }
      if (!endDate) { alert("請選擇結束日期"); return; }
      if (!endTime) { alert("請選擇結束時間"); return; }
      if (!reason) { alert("請輸入請假原因"); return; }

      const start = new Date(startDate + "T" + startTime + ":00");
      const end = new Date(endDate + "T" + endTime + ":00");

      if (end <= start) {
        alert("結束時間必須晚於開始時間");
        return;
      }

      submitToAppsScript({
        action: "leave",
        name: userName,
        userId: userId,
        leaveType: leaveType,
        startDate: startDate,
        startTime: startTime,
        endDate: endDate,
        endTime: endTime,
        reason: reason
      });

      alert("請假申請已送出，狀態：待審核");

      document.getElementById("leave-start").value = "";
      document.getElementById("leave-start-time").value = "";
      document.getElementById("leave-end").value = "";
      document.getElementById("leave-end-time").value = "";
      document.getElementById("leave-reason").value = "";

      showHomeMenu();
    }

    function setLoading(message) {
      document.getElementById("loading").innerText = message;
    }

    window.onload = function() {
      if (typeof liff === "undefined") {
        setLoading("LIFF SDK 載入失敗");
        return;
      }
